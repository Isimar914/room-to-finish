<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room to Finish</title>
</head>

<body>
  <header>
    <h1>Room to Finish</h1>
  </header>

  <main>
    <h1>A little structure. More room.</h1>
    <p>Simple tasks and a daily plan to help you make progress on what matters.</p>
    <form class="task-form">
      <!--Label and text box-->
      <div class="form-field">
        <label for="task-name">Task name :</label>
        <input type="text" id="task-name" placeholder="e.g. Read chapter 4">
      </div>
      <!--Time estimate dropdown-->
      <div class="form-field">
        <label for="task-estimate">Estimated time :</label>
        <select id="task-estimate">
          <option value="">Not sure yet</option>
          <option value="0.5">30 minutes</option>
          <option value="1">1 hour</option>
          <option value="2">2 hours</option>
        </select>
      </div>
      <!--Priority dropdown-->
      <div class="form-field">
        <label for="task-priority">Priority :</label>
        <select id="task-priority">
          <option value="">No priority</option>
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>
      </div>
      <!--Due date picker-->
      <div class="form-field">
        <label for="task-due">Due date (Optional):</label>
        <input type="date" id="task-due">
      </div>
      <!--Add task button-->
      <button type="button">Add Task</button>
    </form>
  </main>
</body>
</html>
